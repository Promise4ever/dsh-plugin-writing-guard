name: Publish to npm

# 本 fork 不在 npm 上发布（README 的安装方式只有 GitHub URL / release ZIP / git checkout），
# 因此这里只保留手动触发：推 v* tag 不会再自动跑发布流程、也不会因为没有 NPM_TOKEN 而报红。
# 确实需要发布时，在 Actions 页手动 Run workflow，并先在仓库 Secrets 里配好 NPM_TOKEN。
on:
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 允许 npm 发布 provenance（SLSA）——pnpm 11 在 GitHub Actions 中默认启用 OIDC
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # 版本统一从 package.json 的 packageManager 字段读取，不显式传 version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # 发布 npm 包；版本号取自 package.json（tag 触发时由 v* tag 对齐，
      # workflow_dispatch 手动触发时发布当前分支 package.json 的版本）
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
